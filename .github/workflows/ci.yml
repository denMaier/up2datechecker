name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest stable Go, so a Go security release is picked up without
          # editing go.mod. go.mod stays the minimum; releases build with it.
          go-version: stable
          check-latest: true
      - run: make test
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: shellcheck -S warning deploy/install.sh
