version: 2
updates:
  # "fix(deps)" makes a dependency update a patch release.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
  # CI-only changes ship nothing, so "ci(deps)" makes no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
